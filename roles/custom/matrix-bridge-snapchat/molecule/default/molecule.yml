---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: matrix-bridge-snapchat-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        matrix_bridge_snapchat_enabled: true
        matrix_bridge_snapchat_container_network: matrix-bridge-snapchat-molecule

        # The stub is not a real homeserver and the scenario carries no Snapchat
        # credentials. Logged out is the intended component boundary.
        matrix_bridge_snapchat_homeserver_address: http://matrix.molecule.local:8008
        matrix_bridge_snapchat_homeserver_domain: molecule.local
        matrix_bridge_snapchat_homeserver_async_media: true

        # Use a non-default listener to prove configuration, service command and
        # routing labels agree on the appservice endpoint.
        matrix_bridge_snapchat_appservice_port: 8766

        # Postgres is the normal deployment path. Distinct names make the migrated
        # schema evidence that the role composed this connection successfully.
        matrix_bridge_snapchat_database_engine: postgres
        matrix_bridge_snapchat_database_hostname: matrix-postgres-molecule
        matrix_bridge_snapchat_database_name: molecule_snapchat
        matrix_bridge_snapchat_database_username: molecule_snapchat
        matrix_bridge_snapchat_database_password: molecule_pg_password_8f527c

        matrix_bridge_snapchat_appservice_token: molecule_snapchat_as_token_d74a61
        matrix_bridge_snapchat_homeserver_token: molecule_snapchat_hs_token_7b39e2
        matrix_bridge_snapchat_appservice_bot_username: molecule-snapchatbot
        matrix_bridge_snapchat_appservice_bot_displayname: Molecule Snapchat bridge
        matrix_bridge_snapchat_appservice_bot_avatar: mxc://molecule.local/snapchatMoleculeAvatar

        # Exercise role-rendered Snapchat and generic bridge behavior with values that
        # differ from the role and component defaults.
        #
        # The talkcore host runs on loopback inside the container, so these three
        # overrides prove the rendered network section carries the scenario's values
        # rather than the role's defaults (the constants are asserted in verify.yml).
        matrix_bridge_snapchat_network_displayname_template: "{% raw %}{{ or .DisplayName .Username }} via Molecule{% endraw %}"
        matrix_bridge_snapchat_network_talkcore_service_address: http://127.0.0.1:29555
        matrix_bridge_snapchat_network_talkcore_startup_timeout: 45
        matrix_bridge_snapchat_network_talkcore_store_dir: /app/data/molecule-talkcore
        matrix_bridge_snapchat_command_prefix: "!molecule-snapchat"
        matrix_bridge_snapchat_bridge_permissions:
          "*": commands
          molecule.local: admin
        matrix_bridge_snapchat_bridge_split_portals: true
        matrix_bridge_snapchat_bridge_cleanup_on_logout_enabled: true
        matrix_bridge_snapchat_bridge_cleanup_on_logout_manual_private: kick
        matrix_bridge_snapchat_bridge_cleanup_on_logout_manual_relayed: unbridge
        matrix_bridge_snapchat_bridge_cleanup_on_logout_manual_shared_no_users: delete
        matrix_bridge_snapchat_bridge_cleanup_on_logout_manual_shared_has_users: kick
        matrix_bridge_snapchat_bridge_cleanup_on_logout_bad_credentials_private: delete
        matrix_bridge_snapchat_bridge_cleanup_on_logout_bad_credentials_relayed: kick
        matrix_bridge_snapchat_bridge_cleanup_on_logout_bad_credentials_shared_no_users: unbridge
        matrix_bridge_snapchat_bridge_cleanup_on_logout_bad_credentials_shared_has_users: delete
        matrix_bridge_snapchat_matrix_federate_rooms: true
        matrix_bridge_snapchat_backfill_enabled: false
        matrix_bridge_snapchat_backfill_max_initial_messages: 17
        matrix_bridge_snapchat_backfill_max_catchup_messages: 29
        matrix_bridge_snapchat_provisioning_shared_secret: molecule_snapchat_provisioning_secret_43c1ea
        matrix_bridge_snapchat_double_puppet_secrets_custom:
          molecule.remote: molecule_snapchat_double_puppet_51d28a
        matrix_bridge_snapchat_logging_level: info

        # Public media needs no external test fixture and is disabled here; bridge API
        # exposure remains enabled to exercise its generated Traefik contract.
        matrix_bridge_snapchat_public_media_enabled: false
        matrix_bridge_snapchat_appservice_public_address: http://snapchat-public.molecule.local
        matrix_bridge_snapchat_exposure_enabled: true
        matrix_bridge_snapchat_exposure_hostname: snapchat-api.molecule.local
        matrix_bridge_snapchat_exposure_path_prefix: /bridges/snapchat-api
        matrix_bridge_snapchat_container_labels_traefik_enabled: true
        matrix_bridge_snapchat_container_labels_traefik_entrypoints: web
        matrix_bridge_snapchat_container_labels_traefik_tls: false
        matrix_bridge_snapchat_container_labels_additional_labels: |
          molecule.snapchat.coverage=enabled

        matrix_bridge_snapchat_container_extra_arguments:
          - --hostname=snapchat-bridge-molecule-runtime
          - --label=molecule.snapchat.extra-argument=reached

        # verify.yml is a separate play, where role defaults are out of scope.
        matrix_bridge_snapchat_base_path: /matrix/matrix-snapchat-bridge
        matrix_bridge_snapchat_config_path: /matrix/matrix-snapchat-bridge/config
        matrix_bridge_snapchat_data_path: /matrix/matrix-snapchat-bridge/data
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:${ANSIBLE_HOME:-~/.ansible}/roles
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
